<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f2417">
<title>Anotador 10.000</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../common.css">
<style>
.turn{border-color:var(--gold)}
.tot{font-size:44px;font-weight:800;color:var(--gold);line-height:1.1}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}
.quick button{background:var(--card2);color:var(--text);border:1px solid var(--line);padding:11px 0;font-size:15px}
.dice{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:10px 0}
.die{background:#f3efe2;color:#14321f;border:0;border-radius:10px;font-size:30px;line-height:1;padding:6px 0}
.tray{display:flex;gap:6px;flex-wrap:wrap;min-height:44px;align-items:center;padding:6px;background:var(--bg);border-radius:10px}
.tray .die{font-size:30px;padding:4px 6px;background:var(--gold)}
.calcv{font-size:22px;font-weight:800;color:var(--gold)}
</style>
</head>
<body>
<main>
  <a class="backlink" href="../index.html">← Juegos</a>
  <h1>🎲 10.000</h1>
</main>
<script src="../common.js"></script>
<script>
const FACES=['','⚀','⚁','⚂','⚃','⚄','⚅'];
const GOAL=10000, MIN=750;
let calcOpen=false, tray=[];

/* valor de una tirada de dados */
function diceValue(d){
  if(!d.length)return {v:0,t:''};
  const c=[0,0,0,0,0,0,0]; d.forEach(x=>c[x]++);
  const s=[...new Set(d)].sort().join('');
  if(d.length===5&&new Set(d).size===5&&(s==='12345'||s==='23456'||s==='13456'))return {v:500,t:'Escalera'};
  let v=0, parts=[];
  for(let n=1;n<=6;n++){
    if(!c[n])continue;
    if(c[n]===3){const x=n===1?1000:n*100;v+=x;parts.push(`tres ${n} = ${U.fmt(x)}`)}
    else{
      if(n===1){v+=c[n]*100;parts.push(`${c[n]}×1 = ${c[n]*100}`)}
      else if(n===5){v+=c[n]*50;parts.push(`${c[n]}×5 = ${c[n]*50}`)}
    }
  }
  return {v,t:parts.join(' · ')||'No vale nada'};
}

const G={
  subtitle:()=>'A 10.000 · mínimo 750 para entrar',
  key:'diezmil_v1', title:'10.000', minP:2, maxP:8,
  whoNote:'en el orden en que tiran',
  rules:`
    <li>Cada uno tira en su turno y anota los puntos que hizo, o 0 si se quemó.</li>
    <li>Para <b>entrar</b> hay que hacer al menos <b>750</b> en un turno.</li>
    <li><b>1</b> vale 100 y <b>5</b> vale 50.</li>
    <li><b>Tres iguales</b> valen ese número × 100 (tres 2 = 200, tres 6 = 600), pero <b>tres 1 = 1.000</b>.</li>
    <li>Con <b>cuatro iguales</b> no vale la multiplicación: solo cuentan los 1 y los 5 sueltos.</li>
    <li><b>Escalera</b> (1-5, 2-6 o 3-4-5-6-1) vale 500.</li>
    <li>Gana el primero que llega a 10.000.</li>`,
  newState(players,o,prev){
    const n=players.length, start=prev?((prev.start||0)+1)%n:0;
    return {scores:Array(n).fill(0),entered:Array(n).fill(false),turns:[],turn:start,start,cur:''};
  },
  result(S){
    const max=Math.max(...S.scores), w=S.players.map((_,i)=>i).filter(i=>S.scores[i]===max);
    return {winners:w,text:`${U.fmt(max)} puntos`};
  },
  endHtml(S){return `<div class="card"><h2>Planilla</h2>${planilla(S)}</div>`},
  render(S,api){
    const $=U.$, esc=U.esc, fmt=U.fmt, p=S.turn;
    const cur=parseInt(S.cur,10)||0;
    const needEntry=!S.entered[p];
    let h=`<div class="card turn"><div class="row between"><div><div class="sub" style="margin:0">Tira</div><h2 style="margin:0;font-size:22px">${esc(S.players[p])}</h2></div>
      <div style="text-align:right"><div class="sub" style="margin:0">Tiene</div><div style="font-size:20px;font-weight:700">${fmt(S.scores[p])}</div></div></div>
      ${needEntry?`<div class="note" style="margin-top:10px">Todavía no entró: necesita <b>${MIN}</b> en este turno.</div>`:''}
      <div class="sub" style="margin:12px 0 4px">Puntos de este turno</div>
      <div class="row"><input type="number" inputmode="numeric" id="cur" value="${S.cur}" placeholder="0" style="font-size:26px;font-weight:800;text-align:center">
        <button class="ghost small" id="clr">Borrar</button></div>
      <div class="quick">${[50,100,200,300,400,500,600,1000].map(x=>`<button data-q="${x}">+${fmt(x)}</button>`).join('')}</div>
      <button class="ghost small" id="calcT" style="width:100%">🎲 ${calcOpen?'Ocultar':'Abrir'} calculadora de dados</button>
      <div id="calc" class="${calcOpen?'':'hidden'}" style="margin-top:10px"></div>
      <div class="sub" id="after" style="margin:12px 0 8px"></div>
      <div class="footer"><button class="ghost" id="burn">Se quemó (0)</button><button class="primary" id="ok">Anotar</button></div>
    </div>`;
    h+=`<div class="card"><h2>Posiciones</h2>${U.rankHtml(S.players,S.scores,{
      tag:i=>i===p?'<span class="pill gold">tira</span>':'',
      meta:i=>S.entered[i]?(S.scores[i]>=GOAL?'¡llegó!':`le faltan ${fmt(GOAL-S.scores[i])}`):`no entró (mínimo ${MIN})`,
      bar:i=>S.scores[i]/GOAL*100})}</div>`;
    h+=`<div class="card"><h2>Planilla</h2>${planilla(S)}</div>`;
    $('game').innerHTML=h;

    const upd=()=>{
      const v=parseInt(S.cur,10)||0, after=S.scores[p]+v;
      const blocked=needEntry&&v>0&&v<MIN;
      $('after').innerHTML=blocked?`<span class="bad">Con ${fmt(v)} no entra: necesita ${MIN}.</span>`
        :v?`Queda en <b style="color:var(--text)">${fmt(after)}</b>${after>=GOAL?' · <span class="ok">¡llega a 10.000!</span>':` · le faltan ${fmt(GOAL-after)}`}`:'Cargá los puntos o tocá "Se quemó".';
      $('ok').disabled=!v||blocked;
    };
    upd();
    $('cur').oninput=e=>{S.cur=e.target.value.replace(/[^0-9]/g,'');api.save();upd()};
    $('clr').onclick=()=>{S.cur='';api.save();api.rerender()};
    $('game').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.cur=String((parseInt(S.cur,10)||0)+ +b.dataset.q);api.save();api.rerender()});
    $('calcT').onclick=()=>{calcOpen=!calcOpen;api.rerender()};
    const commit=v=>api.mutate(S=>{
      if(v>0)S.entered[p]=true;
      S.scores[p]+=v;S.turns.push({p,v});S.cur='';
      if(S.scores[p]>=GOAL)S.over=true;else S.turn=(p+1)%S.players.length;
    });
    $('ok').onclick=()=>commit(parseInt(S.cur,10)||0);
    $('burn').onclick=()=>commit(0);
    if(calcOpen)renderCalc(S,api);
  }
};
function renderCalc(S,api){
  const $=U.$, r=diceValue(tray);
  $('calc').innerHTML=`<div class="sub" style="margin:0 0 6px">Tocá los dados que separaste (hasta 5).</div>
    <div class="dice">${[1,2,3,4,5,6].map(n=>`<button class="die" data-d="${n}">${FACES[n]}</button>`).join('')}</div>
    <div class="tray">${tray.map((d,i)=>`<button class="die" data-x="${i}">${FACES[d]}</button>`).join('')||'<span class="mut" style="font-size:13px;padding:0 6px">Sin dados</span>'}</div>
    <div class="row between" style="margin-top:8px"><div><div class="calcv">${U.fmt(r.v)}</div><div class="sub" style="margin:0">${r.t}</div></div>
      <button class="primary small" style="width:auto" id="cAdd" ${r.v?'':'disabled'}>Sumar al turno</button></div>`;
  $('calc').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(tray.length<5){tray.push(+b.dataset.d);renderCalc(S,api)}});
  $('calc').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{tray.splice(+b.dataset.x,1);renderCalc(S,api)});
  $('cAdd').onclick=()=>{S.cur=String((parseInt(S.cur,10)||0)+r.v);tray=[];api.save();api.rerender()};
}
function planilla(S){
  const n=S.players.length, rounds=[];
  let k=0;
  S.turns.forEach(t=>{
    // nueva vuelta cuando vuelve a tirar quien arrancó
    if(t.p===S.start||!rounds.length){if(t.p===S.start||!rounds.length)rounds.push({pts:Array(n).fill(null)})}
    rounds[rounds.length-1].pts[t.p]=t.v;
  });
  return U.sheetTable(S.players,rounds,S.scores,{cls:v=>v>0?'':'neg',cellFmt:v=>v?U.fmt(v):'✕'});
}
U.app(G);
</script>
</body>
</html>
