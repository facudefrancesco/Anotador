<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0f2417">
<title>Anotador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#0f2417;--card:#173822;--card2:#1d4429;--line:#2c5a39;--text:#f3efe2;--muted:#b5c2b0;--gold:#e8c35a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:18px 16px 40px;max-width:560px;margin:0 auto}
h1{font-size:26px;color:var(--gold);margin:10px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:18px}
.game{display:flex;gap:12px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px;color:var(--text)}
.game:active{background:var(--card2)}
.ic{font-size:34px;line-height:1;flex:none}
.art{width:110px;height:77px;flex:none;margin:-6px -6px -6px 0}
.tx{flex:1}
.tx b{display:block;font-size:20px;color:var(--gold)}
.tx span{display:block;font-size:13px;color:var(--muted);margin-top:3px}
.live{display:inline-block!important;margin-top:8px!important;font-size:12px!important;font-weight:700;color:#1b1b1b!important;background:var(--gold);border-radius:20px;padding:2px 9px}
#install{display:none;width:100%;margin-top:10px;background:var(--gold);color:#1b1b1b;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px}
.foot{margin-top:24px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<h1>🎴 Anotador</h1>
<div class="sub">¿Qué juegan hoy?</div>
<div id="list"></div>
<button id="install">Instalar en el celular</button>
<div class="foot" id="foot"></div>

<script src="games.js"></script>
<script>
function inProgress(k){
  if(!k)return false;
  try{const v=JSON.parse(localStorage.getItem(k)||'null');return !!(v&&!v.over)}catch(e){return false}
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderList(){
  document.getElementById('list').innerHTML=self.GAMES.map(g=>`
    <a class="game" href="${esc(g.file)}">
      ${g.art?'':`<span class="ic">${g.icon}</span>`}
      <span class="tx"><b>${esc(g.name)}</b><span>${esc(g.desc||'')}</span>
      ${inProgress(g.key)?'<span class="live">Partida en curso</span>':''}</span>
      ${g.art?`<img class="art" src="${esc(g.art)}" alt="">`:''}
    </a>`).join('');
}
renderList();
window.addEventListener('pageshow',renderList);

/* offline */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(()=>{
    document.getElementById('foot').textContent='Funciona sin internet';
  }).catch(()=>{});
}
/* botón de instalar (Chrome / Android) */
let deferred=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferred=e;
  document.getElementById('install').style.display='block';
});
document.getElementById('install').onclick=async()=>{
  if(!deferred)return;
  deferred.prompt();await deferred.userChoice;deferred=null;
  document.getElementById('install').style.display='none';
};
</script>
</body>
</html>
